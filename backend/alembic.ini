[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally left unset here - env.py builds it from
# adc_backend.config.get_database_url() so migrations use the exact same
# connection logic (DATABASE_URL locally, Secrets Manager in real
# environments) as the app itself. Never put a URL/credential here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
